[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onaa-direct-trade-demo"
version = "0.2.0"
description = "ONAA reference demo (SAMPLE): buyer -> registry discovery -> direct A2A 1.0 ONAA Protocol v0.1 RFQ/QUOTE/ORDER with seller -> MOCK escrow service handoff. No real funds."
requires-python = ">=3.12"
# Also requires the local package ../../packages/onaa-protocol (import name onaa_protocol). It is
# deliberately NOT listed here: it is not published, and naming an unpublished distribution would let
# pip resolve it from a public index (dependency confusion). Install it first:
#   pip install -e ../../packages/onaa-protocol && pip install -e '.[dev]'
dependencies = [
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "starlette==0.46.2",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.4",
]

[project.scripts]
onaa-direct-trade-demo = "onaa_demo.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
