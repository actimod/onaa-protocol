# Public CI for the ONAA protocol repository.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists PR commits
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  registry-api:
    name: Registry API tests (apps/api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Detect apps/api
        id: detect
        run: |
          if [ -f apps/api/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install and test
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/api
        run: |
          pip install -e '.[dev]'
          pytest -q
      - name: Skip notice
        if: steps.detect.outputs.present != 'true'
        run: echo "apps/api not present yet; skipping."

  direct-trade-demo:
    name: Direct trade demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/direct-trade-demo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install example (pinned deps)
        run: pip install -e '.[dev]'
      - name: Install apps/api for the optional registry contract test (if present)
        run: |
          if [ -f ../../apps/api/pyproject.toml ]; then
            pip install ../../apps/api
          else
            echo "apps/api not present; real-registry contract test will be skipped."
          fi
      - name: Lint
        run: ruff check .
      - name: Tests (in-process / ephemeral localhost ports, no external network)
        run: python -m pytest -q -rs
      - name: Run demo end to end
        run: SKIP_INSTALL=1 PYTHON=python ./scripts/run_demo.sh

  registry-api-postgres:
    name: Registry API tests on PostgreSQL 16 (apps/api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI-only service credentials, not a secret.
          POSTGRES_USER: onaa
          POSTGRES_PASSWORD: onaa
          POSTGRES_DB: onaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Detect apps/api postgres extra
        id: detect
        run: |
          if [ -f apps/api/pyproject.toml ] && grep -qE '^\s*postgres\s*=' apps/api/pyproject.toml; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install and test against PostgreSQL
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/api
        env:
          ONAA_TEST_DATABASE_URL: postgresql+psycopg://onaa:onaa@localhost:5432/onaa_test
        run: |
          pip install -e '.[dev,postgres]'
          pytest -q
      - name: Skip notice
        if: steps.detect.outputs.present != 'true'
        run: echo "apps/api postgres extra not present yet; skipping."

  sdk-python:
    name: Python SDK (packages/sdk-python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Detect packages/sdk-python
        id: detect
        run: |
          if [ -f packages/sdk-python/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pip install ruff==0.14.4 -e apps/api -e 'packages/sdk-python[dev]'
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: ruff check packages/sdk-python
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        working-directory: packages/sdk-python
        run: pytest -q
      - name: Skip notice
        if: steps.detect.outputs.present != 'true'
        run: echo "packages/sdk-python not present yet; skipping."

  mcp-registry:
    name: Registry MCP adapter (apps/mcp-registry)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Detect apps/mcp-registry
        id: detect
        run: |
          if [ -f apps/mcp-registry/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
      # Dedicated env: mcp needs Starlette >=0.49, which conflicts with apps/api (FastAPI 0.115). Do not install apps/api here.
      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pip install ruff==0.14.4 -e packages/sdk-python -e 'apps/mcp-registry[dev]'
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: ruff check apps/mcp-registry
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/mcp-registry
        run: pytest -q
      - name: Skip notice
        if: steps.detect.outputs.present != 'true'
        run: echo "apps/mcp-registry not present yet; skipping."
