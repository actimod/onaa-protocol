# Public CI for the ONAA protocol repository (generated from the maintainers' CI).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:  # manual full run of every job

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which component jobs this change needs, so docs/ops-only changes skip the heavy jobs
  # (saves Actions minutes). Any workflow change, a push without a usable diff, or a manual run selects everything.
  # Draft PRs run nothing; marking the PR ready for review runs the full set.
  changes:
    name: Detect changed components
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.f.outputs.api }}
      protocol: ${{ steps.f.outputs.protocol }}
      demo: ${{ steps.f.outputs.demo }}
      paysim: ${{ steps.f.outputs.paysim }}
      sdk: ${{ steps.f.outputs.sdk }}
      mcp: ${{ steps.f.outputs.mcp }}
      steward: ${{ steps.f.outputs.steward }}
      container: ${{ steps.f.outputs.container }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A PR checkout is the merge commit, so parent 1 is the base; a push compares against the previous tip.
          case "$EVENT" in
            pull_request) base="HEAD^1" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! files="$(git diff --name-only "$base" HEAD)"; then
            files=".github/workflows/ci.yml"  # unknown range: run everything
          fi
          printf '%s\n' "$files"
          all='^\.github/'
          sel() { if printf '%s\n' "$files" | grep -qE "$all|$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          sel api       '^(apps/api|packages/onaa-protocol)/'
          sel protocol  '^(packages/onaa-protocol|specs)/'
          sel demo      '^(examples/direct-trade-demo|packages/onaa-protocol|apps/api|specs)/'
          sel paysim    '^(examples/payment-match-sim|packages/onaa-protocol|apps/api)/'
          sel sdk       '^(packages/sdk-python|packages/onaa-protocol|apps/api)/'
          sel mcp       '^(apps/mcp-registry|apps/steward|packages/sdk-python|packages/onaa-protocol|apps/api)/'
          sel steward   '^(apps/steward|packages/onaa-protocol|apps/api)/'
          sel container '^(infra/registry|apps|packages)/'
          cat "$GITHUB_OUTPUT"

  secret-scan:
    name: Secret scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists PR commits
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  registry-api:
    name: Registry API tests (apps/api)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Detect apps/api
        id: detect
        run: |
          if [ -f apps/api/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/pyproject.toml
      - name: Install and test
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/api
        run: |
          pip install -e ../../packages/onaa-protocol -e '.[dev]' ruff==0.14.4
          ruff check .
          pytest -q
      - name: Skip notice
        if: steps.detect.outputs.present != 'true'
        run: echo "apps/api not present yet; skipping."

  onaa-protocol:
    name: ONAA Protocol v0.1 library + conformance (packages/onaa-protocol)
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/onaa-protocol
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/pyproject.toml
      - name: Install package (pinned deps)
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest -q -rs
      - name: Test vectors are up to date (deterministic regeneration)
        run: python -m onaa_protocol.vectors check ../../specs/test-vectors/v0.1
      - name: Offline conformance against specs/test-vectors/v0.1
        run: python -m onaa_protocol.conformance --offline --vectors ../../specs/test-vectors/v0.1 --out conformance-offline.json

  direct-trade-demo:
    name: Direct trade demo
    needs: changes
    if: needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/direct-trade-demo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/pyproject.toml
      - name: Install onaa-protocol (local package, required first)
        run: pip install -e ../../packages/onaa-protocol
      - name: Install example (pinned deps)
        run: pip install -e '.[dev]'
      - name: Install apps/api for the optional registry contract test (if present)
        run: |
          if [ -f ../../apps/api/pyproject.toml ]; then
            pip install ../../apps/api
          else
            echo "apps/api not present; real-registry contract test will be skipped."
          fi
      - name: Lint
        run: ruff check .
      - name: Tests incl. live conformance of seller/escrow/buyer (ephemeral localhost ports, no external network)
        run: python -m pytest -q -rs
      - name: Run demo end to end
        run: SKIP_INSTALL=1 PYTHON=python ./scripts/run_demo.sh

  registry-api-postgres:
    name: Registry API tests on PostgreSQL 16 (apps/api)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI-only service credentials, not a secret.
          POSTGRES_USER: onaa
          POSTGRES_PASSWORD: onaa
          POSTGRES_DB: onaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Detect apps/api postgres extra
        id: detect
        run: |
          if [ -f apps/api/pyproject.toml ] && grep -qE '^\s*postgres\s*=' apps/api/pyproject.toml; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/pyproject.toml
      - name: Install and test against PostgreSQL
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/api
        env:
          ONAA_TEST_DATABASE_URL: postgresql+psycopg://onaa:onaa@localhost:5432/onaa_test
        run: |
          pip install -e ../../packages/onaa-protocol -e '.[dev,postgres]'
          pytest -q
      - name: Skip notice
        if: steps.detect.outputs.present != 'true'
        run: echo "apps/api postgres extra not present yet; skipping."

  sdk-python:
    name: Python SDK (packages/sdk-python)
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Detect packages/sdk-python
        id: detect
        run: |
          if [ -f packages/sdk-python/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/pyproject.toml
      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pip install ruff==0.14.4 -e packages/onaa-protocol -e apps/api -e 'packages/sdk-python[dev,verify]'
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: ruff check packages/sdk-python
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        working-directory: packages/sdk-python
        run: pytest -q
      - name: Skip notice
        if: steps.detect.outputs.present != 'true'
        run: echo "packages/sdk-python not present yet; skipping."

  mcp-registry:
    name: Registry MCP adapter (apps/mcp-registry)
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Detect apps/mcp-registry
        id: detect
        run: |
          if [ -f apps/mcp-registry/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/pyproject.toml
      # Same env as the container: apps/api + SDK + MCP adapter, so tests/test_hosted.py runs the real /mcp endpoint.
      # sse-starlette stays at 3.0.3 (later releases need Starlette >= 0.49; FastAPI 0.115 does not allow it).
      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: >-
          pip install ruff==0.14.4 -e apps/api -e packages/sdk-python -e packages/onaa-protocol -e apps/steward
          -e 'apps/mcp-registry[dev]' 'sse-starlette==3.0.3'
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: ruff check apps/mcp-registry
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/mcp-registry
        run: pytest -q
      - name: Skip notice
        if: steps.detect.outputs.present != 'true'
        run: echo "apps/mcp-registry not present yet; skipping."
  steward:
    name: Registry Steward (apps/steward)
    needs: changes
    if: needs.changes.outputs.steward == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/pyproject.toml
      # Same env as the container; the tests run the spec section 6 MVP scenario against an in-process registry.
      - name: Install
        run: pip install ruff==0.14.4 -e apps/api -e packages/onaa-protocol -e 'apps/steward[dev]'
      - name: Lint
        run: ruff check apps/steward
      - name: Tests
        working-directory: apps/steward
        run: pytest -q

