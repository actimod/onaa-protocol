[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "onaa-sdk"
version = "0.1.0"
description = "Python SDK for the ONAA (Open Network for AI Agents) Registry: register, search and verify agents and services."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27,<0.29"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["onaa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
